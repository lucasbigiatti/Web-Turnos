{% extends "base.html" %}

{% block title %}Editar Turno - Sistema de Gestión de Turnos{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header bg-info text-white">
            <h1><i class="fas fa-calendar-edit"></i> Editar Turno</h1>
        </div>
        <div class="card-body">
            <form method="post" action="{{ url_for('editar_turno', id_turno=turno.id) }}">
                <div class="form-group mb-3">
                    <label for="paciente_id" class="form-label">Paciente:</label>
                    <select id="paciente_id" name="paciente_id" class="form-control" required>
                        <option value="">Seleccione un paciente</option>
                        {% for p in pacientes %}
                            <option value="{{ p.id }}" {% if paciente_seleccionado and paciente_seleccionado.id == p.id %}selected{% endif %}>
                                {{ p.nombre }} {{ p.apellido }} ({{ p.dni }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="fecha" class="form-label">Fecha:</label>
                            <input type="date" id="fecha" name="fecha" class="form-control" required 
                                   value="{{ turno.fecha_form }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-3">
                            <label for="hora" class="form-label">Hora:</label>
                            <input type="time" id="hora" name="hora" class="form-control" required
                                   value="{{ turno.hora_form }}">
                        </div>
                    </div>
                </div>
                
                <div class="form-group mb-3">
                    <label for="motivo" class="form-label">Motivo de la consulta:</label>
                    <textarea id="motivo" name="motivo" class="form-control" rows="3">{{ turno.motivo }}</textarea>
                </div>
                
                <div class="form-group mb-3">
                    <label for="estado" class="form-label">Estado:</label>
                    <select id="estado" name="estado" class="form-control" required>
                        <option value="pendiente" {% if turno.estado == 'pendiente' %}selected{% endif %}>Pendiente</option>
                        <option value="confirmado" {% if turno.estado == 'confirmado' %}selected{% endif %}>Confirmado</option>
                        <option value="completado" {% if turno.estado == 'completado' %}selected{% endif %}>Completado</option>
                        <option value="cancelado" {% if turno.estado == 'cancelado' %}selected{% endif %}>Cancelado</option>
                    </select>
                </div>
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Actualizar Turno
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
